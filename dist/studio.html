<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CREASE · Motion Studio</title><link rel="stylesheet" href="studio.css"></head><body>
<header><a href="./">← CREASE</a><h1>Motion studio</h1><p>Compare the human movement. No ball. No target-direction shortcut.</p></header>
<main><section class="controls"><label><input id="sandboxMode" type="checkbox"> Live physical sandbox</label><label>Shot<select id="studioShot"></select></label><label>Blend with<select id="blendShot"><option value="">No blend</option></select></label><label>Blend <input id="blendAmount" type="range" min="0" max="1" step=".05" value="0"></label><label>Hand<select id="studioHand"><option value="right">Right</option><option value="left">Left</option></select></label><label>Backlift<select id="studioLift"><option>low</option><option selected>medium</option><option>high</option></select></label><label>Route<select id="studioRoute"><option value="lateral">Lateral loop</option><option value="straight">Straighter pickup</option></select></label><label>Line adjustment <input id="studioLine" type="range" min="-.5" max=".5" step=".01" value="0"></label><label>Speed<select id="studioSpeed"><option value=".1">0.1×</option><option value=".25">0.25×</option><option value=".5" selected>0.5×</option><option value="1">1×</option></select></label><label><input type="checkbox" id="showSkeleton" checked> Skeleton</label><label><input type="checkbox" id="showTrails" checked> Motion trails</label><label><input type="checkbox" id="silhouette"> Blind silhouettes</label></section>
<section class="sandboxControls" id="sandboxControls" hidden><label>Hand line<input id="handX" type="range" min="-.55" max=".55" step=".01" value=".15"></label><label>Hand height<input id="handY" type="range" min=".3" max="1.5" step=".01" value=".72"></label><label>Hand depth<input id="handZ" type="range" min="-.2" max=".2" step=".01" value="0"></label><label>Body turn<input id="bodyYaw" type="range" min="-.7" max=".7" step=".01" value="0"></label><label>Bat mass (kg)<input id="batMass" type="range" min="1.1" max="1.3" step=".01" value="1.18"></label><label>Face<input id="faceAngle" type="range" min="-.8" max=".8" step=".01" value="0"></label><label>Foot forward<input id="footZ" type="range" min="-.5" max=".25" step=".01" value="0"></label><label>Top grip<input id="topGrip" type="range" min="0" max="1" step=".05" value="1"></label><label>Bottom grip<input id="bottomGrip" type="range" min="0" max="1" step=".05" value="1"></label><button id="sandboxSwing">Attempt stroke</button><button id="releaseTop">Release top</button><button id="releaseBottom">Release bottom</button><button id="dropBat">Release both / drop</button><button id="throwBat">Swing + release</button><button id="resetBat">Reset body + bat</button></section><section class="stage"><canvas id="studioCanvas" aria-label="Four synchronized views of the batting motion"></canvas><div class="viewLabels"><span>EYE POV</span><span>SIDE</span><span>FRONT</span><span>BOWLER END</span></div></section>
<section class="transport"><button id="studioPlay">Pause</button><button id="studioRestart">Restart</button><button id="studioPrevious">− Frame</button><input id="studioScrub" type="range" min="0" max="1.4" step=".01" value="0" aria-label="Motion time"><button id="studioNext">+ Frame</button><output id="studioTime">0.00 s</output><button id="acceptance">Nine-shot sequence</button><button id="recordNine">Record nine shots</button><button id="recordSide">Record side view</button><button id="exportMotion">Export motion data</button></section>
<div class="legend"><span style="color:#55d8ff">● Top hand</span><span style="color:#fc92d4">● Bottom hand</span><span style="color:#ffba55">● Toe</span><span style="color:#e5ff75">● Sweet spot</span><span style="color:#f6f4e9">● Head</span><span style="color:#7be59b">● Front foot</span><span style="color:#a997ff">● Back foot</span></div><p id="studioStatus" role="status">Authored procedural motion. Coach validation pending.</p><pre id="studioMetrics"></pre>
</main><script type="module" src="studio.js"></script></body></html>
